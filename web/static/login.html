<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Deck">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0B0D"><meta name="color-scheme" content="dark"><title>Omarchy Deck sign in</title>
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/tokens.css">
<script>
// TV view is opt-in, as on the deck: ?view=tv or the stored switch. Never from the user agent alone.
try{if(new URLSearchParams(location.search).get('view')==='tv'||localStorage.getItem('view')==='tv')document.documentElement.classList.add('tv')}catch(e){}
</script>
<style>
html,body{margin:0;min-height:100%;background:var(--c-ground);color:var(--c-text-1)}
body{display:flex;align-items:center;justify-content:center;min-height:100dvh;box-sizing:border-box;
 padding:max(var(--s-4),var(--safe-t)) max(var(--s-4),var(--safe-r)) max(var(--s-4),var(--safe-b)) max(var(--s-4),var(--safe-l));
 font:var(--fw-reg) var(--fs-body)/var(--lh-body) var(--font);-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased;caret-color:var(--c-signal)}
*,*::before,*::after{box-sizing:border-box}
form{display:flex;flex-direction:column;gap:var(--s-4);width:min(26rem,100%);padding:var(--s-5);background:var(--c-panel);border:var(--hair);border-radius:var(--r-panel)}
h1{margin:0;font-size:var(--fs-page);font-weight:var(--fw-semi);line-height:var(--lh-title);letter-spacing:-.02em}
p{margin:0;max-width:var(--measure)}
.lead{color:var(--c-text-2)}
label{display:flex;flex-direction:column;gap:var(--s-2);font-size:var(--fs-meta);color:var(--c-text-2)}
input,button{font-family:inherit;margin:0}
input{width:100%;min-width:0;height:3em;padding:0 var(--s-3);font-size:18px;line-height:1.2;color:var(--c-text-1);background:var(--c-panel-2);border:1px solid var(--c-line-strong);border-radius:var(--r-ctl);-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--c-text-3)}
input:focus-visible{outline:var(--focus);outline-offset:0;border-color:var(--c-signal)}
button{min-height:3em;padding:0 var(--s-4);font-size:18px;font-weight:var(--fw-med);color:var(--c-on-signal);background:var(--c-signal);border:1px solid var(--c-signal);border-radius:var(--r-ctl);cursor:pointer;transition:background-color var(--t-press) var(--ease),transform var(--t-press) var(--ease)}
button:hover{background:var(--c-signal-hi);border-color:var(--c-signal-hi)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:var(--focus);outline-offset:var(--focus-off)}
.err{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3);color:var(--c-text-1);background:var(--c-bad-wash);border:1px solid var(--c-bad-line-bar);border-radius:var(--r-ctl)}
.err[hidden],.tvnote{display:none}
.sd{flex:none;width:.8em;height:.8em;background:var(--c-bad);border-radius:1px;background-image:linear-gradient(45deg,transparent 41%,var(--c-ground) 41% 59%,transparent 59%),linear-gradient(-45deg,transparent 41%,var(--c-ground) 41% 59%,transparent 59%)}
code{font-family:var(--mono);color:var(--c-text-1)}
::selection{background:var(--c-signal-wash);color:var(--c-text-1)}
/* TV: a large field read from across the room, and the one-time link note */
html.tv form{width:min(44rem,90vw);gap:var(--s-5);padding:var(--s-6)}
html.tv input,html.tv button{height:auto;min-height:2.4em;font-size:var(--fs-title)}
html.tv input:focus-visible,html.tv button:focus-visible{outline:var(--focus);outline-offset:var(--focus-off)}
html.tv .tvnote{display:block;color:var(--c-text-2)}
@media (prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
</style></head><body>
<form method="get" action="/" autocomplete="on">
<h1>Omarchy Deck</h1>
<p class="lead">Paste your deck token once. This device stays signed in.</p>
<p class="err" id="err" role="alert" hidden><span class="sd" aria-hidden="true"></span>That token did not work. Check it and try again.</p>
<label for="t">Deck token<input id="t" name="t" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required minlength="8"></label>
<button type="submit">Sign in</button>
<p class="tvnote">You can also open your deck link with <code>?t=</code> once. This TV stays signed in after that.</p>
</form>
<script>
// The server answers a token that did not match with this page again, at the same address. Say so, then take the token
// out of the address bar so it is not kept in history. A TV keeps its view=tv through the sign-in.
(function(){
 var q=new URLSearchParams(location.search),f=document.forms[0];
 if(q.has('t')){document.getElementById('err').hidden=false;q.delete('t');var s=q.toString();try{history.replaceState(null,'',location.pathname+(s?'?'+s:'')+location.hash)}catch(e){}}
 if(q.get('view')==='tv'){var v=document.createElement('input');v.type='hidden';v.name='view';v.value='tv';f.appendChild(v)}
})();
</script>
</body></html>
