[package]
name = "pixel-deck"
version = "1.0.0"
edition = "2021"
description = "Pixel Deck: touch deck server for pc-desktop and Dell"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "fs", "signal", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
