<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Omarchy Deck architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.5}
      .store{fill:#ecfdf5;stroke:#15803d;stroke-width:1.5}
      .app{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.5}
      .ext{fill:#f8fafc;stroke:#64748b;stroke-width:1.5;stroke-dasharray:5 4}
      .t{fill:#0f172a;font-weight:600}
      .s{fill:#475569;font-size:12px}
      .l{fill:#334155;font-size:12px}
      .e{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect x="0" y="0" width="1040" height="520" fill="#ffffff"/>

  <rect x="190" y="20" width="560" height="480" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="210" y="46" class="t">Your Linux server (on-prem)</text>

  <rect x="20" y="70" width="140" height="56" rx="8" class="ext"/>
  <text x="90" y="94" text-anchor="middle" class="t">Public data</text>
  <text x="90" y="112" text-anchor="middle" class="s">NOAA, FRED, Census</text>

  <rect x="220" y="70" width="190" height="56" rx="8" class="box"/>
  <text x="315" y="94" text-anchor="middle" class="t">Collectors</text>
  <text x="315" y="112" text-anchor="middle" class="s">Python + systemd timers</text>

  <rect x="220" y="200" width="190" height="56" rx="8" class="store"/>
  <text x="315" y="224" text-anchor="middle" class="t">Feed files</text>
  <text x="315" y="242" text-anchor="middle" class="s">JSON on local disk</text>

  <rect x="500" y="150" width="210" height="56" rx="8" class="app"/>
  <text x="605" y="174" text-anchor="middle" class="t">Deck server</text>
  <text x="605" y="192" text-anchor="middle" class="s">Rust, axum, token cookie</text>

  <rect x="500" y="300" width="210" height="56" rx="8" class="app"/>
  <text x="605" y="324" text-anchor="middle" class="t">MCP server</text>
  <text x="605" y="342" text-anchor="middle" class="s">Python, read-only, stdio</text>

  <rect x="220" y="400" width="190" height="56" rx="8" class="ext"/>
  <text x="315" y="424" text-anchor="middle" class="t">Local services</text>
  <text x="315" y="442" text-anchor="middle" class="s">Home Assistant, model server</text>

  <rect x="820" y="40" width="200" height="56" rx="8" class="box"/>
  <text x="920" y="64" text-anchor="middle" class="t">Web deck</text>
  <text x="920" y="82" text-anchor="middle" class="s">browser or wall phone</text>

  <rect x="820" y="150" width="200" height="56" rx="8" class="box"/>
  <text x="920" y="174" text-anchor="middle" class="t">iPhone and iPad app</text>
  <text x="920" y="192" text-anchor="middle" class="s">SwiftUI + WKWebView</text>

  <rect x="820" y="250" width="200" height="56" rx="8" class="box"/>
  <text x="920" y="274" text-anchor="middle" class="t">Apple Watch</text>
  <text x="920" y="292" text-anchor="middle" class="s">fixed quick actions</text>

  <rect x="820" y="360" width="200" height="56" rx="8" class="box"/>
  <text x="920" y="384" text-anchor="middle" class="t">AI agent</text>
  <text x="920" y="402" text-anchor="middle" class="s">any MCP client</text>

  <path d="M160 98H218" class="e"/>
  <text x="166" y="90" class="l">HTTPS</text>
  <path d="M315 126V198" class="e"/>
  <text x="322" y="166" class="l">write</text>
  <path d="M410 222L498 186" class="e"/>
  <text x="436" y="192" class="l">read</text>
  <path d="M410 236L498 318" class="e"/>
  <text x="436" y="292" class="l">read</text>
  <path d="M500 196L412 412" class="e"/>
  <text x="430" y="370" class="l">loopback</text>
  <path d="M710 166L818 76" class="e"/>
  <path d="M710 178H818" class="e"/>
  <text x="730" y="138" class="l">HTTPS + token</text>
  <path d="M920 206V248" class="e"/>
  <text x="928" y="232" class="l">phone relays</text>
  <path d="M710 328L818 384" class="e"/>
  <text x="740" y="372" class="l">stdio</text>
</svg>
